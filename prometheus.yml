global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # 监控 Prometheus 本身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 监控 Docker Swarm 节点
  - job_name: 'node_exporter'
    dns_sd_configs:
      - names:
          - 'tasks.node-exporter'
        type: 'A'
        port: 9100

  # 监控容器
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.cadvisor'
        type: 'A'
        port: 8080

  # 监控 ai-service（AIOps 指标：AI 请求 + RAG 检索分段延迟）
  - job_name: 'ai-service'
    metrics_path: '/api/ai/aiops/prometheus'
    static_configs:
      - targets: ['ai:8083']

  # 监控微服务（每个服务端口不同，用 static_configs 按实际端口列出）
  # gateway=8080 / user=8081 / file=8082 / ai=8083 / document=8084
  - job_name: 'dockit-services'
    static_configs:
      - targets:
          - 'gateway:8080'
          - 'user:8081'
          - 'file:8082'
          - 'ai:8083'
          - 'document:8084'

  # 监控基础设施服务
  - job_name: 'dockit-infra'
    static_configs:
      - targets: ['mysql:9104']     # 需要启动 mysql exporter 容器
      - targets: ['redis:9121']     # 需要启动 redis exporter 容器
      - targets: ['rabbitmq:15692'] # RabbitMQ 自带 Prometheus 端点
      - targets: ['nacos:8848']     # Nacos 自带监控端点
